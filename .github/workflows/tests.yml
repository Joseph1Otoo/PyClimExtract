name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Live tests reach the IRI Data Library and are excluded by the
      # default pytest options. CI must stay green when a remote service
      # is down; a data provider's outage is not a defect in this package.
      - name: Run tests
        run: pytest -q --cov=pyclimextract --cov-report=term-missing

      - name: Check the tutorial still runs end to end
        run: python examples/tutorial.py

  live:
    # Opt-in: run from the Actions tab to check the remote sources are
    # still reachable and their formats have not changed under us.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -m live -q
